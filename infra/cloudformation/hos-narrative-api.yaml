AWSTemplateFormatVersion: "2010-09-09"
Description: HOS narrative API — Lambda Function URL (reads existing ClassQuip OpenAI secret)

Parameters:
  OpenAISecretArn:
    Type: String
    Default: arn:aws:secretsmanager:us-east-1:177914733797:secret:prod/ClassQuip-vRZIoS
    Description: Existing Secrets Manager ARN (ClassQuip prod bundle with OPENAI_API_KEY). Do not create or modify the secret here.
  AllowedOrigins:
    Type: String
    Default: https://austinbuhltech.com,https://www.austinbuhltech.com
    Description: Comma-separated browser origins allowed to call the Function URL
  OpenAIModel:
    Type: String
    Default: gpt-4o-mini
  LambdaMemoryMb:
    Type: Number
    Default: 256
  LambdaTimeoutSec:
    Type: Number
    Default: 30

Resources:
  HosNarrativeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadClassQuipOpenAISecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref OpenAISecretArn

  HosNarrativeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: austinbuhltech-hos-narrative
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt HosNarrativeRole.Arn
      MemorySize: !Ref LambdaMemoryMb
      Timeout: !Ref LambdaTimeoutSec
      Code:
        ZipFile: |
          export async function handler() {
            return {
              statusCode: 503,
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ error: 'Run scripts/deploy-hos-narrative-api.sh to upload function code.' })
            };
          }
      Environment:
        Variables:
          OPENAI_SECRET_ARN: !Ref OpenAISecretArn
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          OPENAI_MODEL: !Ref OpenAIModel

  HosNarrativeFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt HosNarrativeFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins:
          - https://austinbuhltech.com
          - https://www.austinbuhltech.com
        AllowMethods:
          - POST
        AllowHeaders:
          - content-type
        MaxAge: 86400

  HosNarrativeUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HosNarrativeFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  HosNarrativePublicInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HosNarrativeFunction
      Action: lambda:InvokeFunction
      Principal: "*"

Outputs:
  OpenAISecretArn:
    Description: Existing secret used for OPENAI_API_KEY (read-only from Lambda)
    Value: !Ref OpenAISecretArn
  NarrativeFunctionName:
    Value: !Ref HosNarrativeFunction
  NarrativeApiUrl:
    Description: Set GitHub secret HOS_NARRATIVE_API_URL to this value
    Value: !GetAtt HosNarrativeFunctionUrl.FunctionUrl
